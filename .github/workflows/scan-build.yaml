name: Clang Static Analyzer
on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  security-events: write
jobs:
  scan-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current time
        uses: srfrnk/current-time@5a4163ad035ccd9a407ec9e519c3b6ba1b633d1e
        id: current-time
        with:
          format: YYYYWW
      - name: Get current time with day
        uses: srfrnk/current-time@5a4163ad035ccd9a407ec9e519c3b6ba1b633d1e
        id: current-time-with-day
        with:
          format: YYYYWWd
      - name: Cache bazel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        env:
          cache-name: bazel-cache
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-${{ steps.current-time-with-day.outputs.formattedTime }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.current-time.outputs.formattedTime }}
            ${{ runner.os }}-
      
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: 3.11
      
      - name: Install Python Packages
        run: |
          pip install pyyaml mako virtualenv absl-py
          pip list
      
      - name: Check out repository code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: True
      
      - name: Run Clang Static Analyzer
        run: |
          ANDROID_NDK_HOME= ${{ github.workspace }}/tools/distrib/scan_build_code.sh
        continue-on-error: true
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: scan-build-reports/
        continue-on-error: true
      
      - name: Upload HTML reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-build-reports
          path: scan-build-reports/
          retention-days: 30
